# Who may connect to the cluster (PLAN.md D14).
#
# - Over the socket inside the container (docker exec, pgBackRest), each OS
#   user is the role of the same name: only `postgres`, the admin.
# - Over the network, a role may connect only to the database named after it
#   (`sameuser`), with SCRAM. A tenant's Acquirium logs in as its tenant's role,
#   so it can't reach another tenant's database even with the right address.
#   provision_tenant.sh also revokes CONNECT from PUBLIC on every tenant
#   database.
# - The admin never logs in over the network.

# TYPE  DATABASE  USER      ADDRESS    METHOD
local   all       all                  peer
host    all       postgres  all        reject
host    sameuser  all       all        scram-sha-256
