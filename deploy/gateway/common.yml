# The gateway's shared dynamic configuration (PLAN.md M8); init_gateway.sh
# copies it next to the tenants' routes, where Traefik reads it. With HTTPS,
# init_gateway.sh also writes tls.yml there: the certificate, TLS 1.2 or later,
# HSTS and the redirect from plain HTTP.

http:
  middlewares:
    # On every tenant's route (lib.sh's gateway_route).
    secure-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: no-referrer
