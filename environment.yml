# Deployment environment for flex-orchestrator.
# Upstream packages are pinned to exact commits; bump SHAs in the same PR that
# needs them. Run `idaes get-extensions` after creation for IPOPT.
# Usage: conda env create -f environment.yml
name: flex-orch
channels:
  - conda-forge
dependencies:
  - python=3.12
  - scip=10.0
  - highspy=1.15
  - git # pip installs the pinned flex-pse and Acquirium below from git
  - pip
  - pip:
      # flex-pse v0.2.0 (upstream tag; flowsheet spec schema 0.1.0)
      - "flex-pse[parameterize,solvers] @ git+https://github.com/flex-pse/flex-pse.git@b3cc361681b34da65aa38afb413a5e73fd189941"
      # Acquirium main (PR #78 merged) - switch to a PyPI release once one has it
      - "acquirium @ git+https://github.com/DataDrivenCPS/acquirium.git@227e3f671b0c1b7fbbc83c0af27daa9994aa982d"
      # - "flex-orchestrator[server] @ ."   # enable once M0 adds pyproject.toml
