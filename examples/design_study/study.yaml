# Size a battery and solar for one plant over ten years, at three solar prices.
base_model_spec: plant
design:
  years:
    - {year: 2030, represents: 5}
    - {year: 2035, represents: 5}
  months: # one day of each stands in for its month; use whole months for final sizes
    - {month: 1, weight: 6, days: 1}
    - {month: 7, weight: 6, days: 1}
  changes:
    # Electricity costs more in the second period.
    - element: costing
      years: [2035]
      values: {energy_prices: {electrical: {value: 0.15, units: USD/kWh}}}
    # A file named here is stored with the spec.
    - element: pv
      months: [7]
      values: {construction_options: {capacity_factor: {$source: sun_july.json}}}
  capacities:
    - name: battery_energy
      variable: battery.energy_capacity
      capital_cost: 300
      lifetime_years: 15
      upper: 1500
    - name: solar
      variable: pv.capacity
      capital_cost: 1200
      lifetime_years: 25
      upper: 1500
# The pump's demand, from a projection per modeled year (example.py stores
# them). horizon[2030,*] sets the path in every 2030 horizon, each from its own
# month of projection_2030; horizon[2035,*] does the same with projection_2035.
model_inputs:
  - dataset: projection_2030
    columns: [flow]
    rename: {flow: "horizon[2030,*].pump.inlet_state.flow_vol_phase[*,Liq]"}
  - dataset: projection_2035
    columns: [flow]
    rename: {flow: "horizon[2035,*].pump.inlet_state.flow_vol_phase[*,Liq]"}
sweeps:
  - type: configuration_option
    name: solar_cost
    path: capacities.solar.capital_cost
    values: [100, 600, 2400]
output_name: "solar_{solar_cost}"
export:
  # The summary, plus July's battery schedule in the first period.
  include:
    - "capacity*"
    - "annual*"
    - "horizon*.costing.aggregate_operating_cost"
    - "horizon[2030,7].battery.charge"
