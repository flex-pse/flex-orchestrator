# Development environment for flex-orchestrator.
# flex-pse is the 0.3.1 release from git; to co-develop it, swap that line for
# `-e ../flex-pse[parameterize,solvers,testing]`. Acquirium comes from git, pinned to
# the same commit of main as environment.yml (the experiment/study API came with
# PR #78; no release on PyPI has it yet), never from a local checkout. Binary
# solvers come from conda-forge; run
# `idaes get-extensions` after creation for IPOPT.
# Usage: conda env create -f environment-dev.yml
name: flex-orch-dev
channels:
  - conda-forge
dependencies:
  - python=3.12
  - scip=10.0
  - highspy=1.15
  - pip
  # dev tooling
  - pytest
  - pytest-cov
  - pytest-timeout
  - pytest-xdist
  # code style: same versions as flex-pse's .pre-commit-config.yaml
  - black=26.5.1
  - ruff=0.15.20
  - pre-commit
  - import-linter
  - ipykernel
  # docs (same stack as flex-pse)
  - sphinx
  - myst-parser
  - furo
  # the marimo tutorials (tutorials/)
  - marimo
  - altair
  - pip:
      # flex-pse 0.3.1 (flowsheet spec schema 0.1.1; storage `cyclic` options). The tag's
      # dist-info still says 0.1.0, so moving the pin needs `pip install --force-reinstall`.
      - "flex-pse[parameterize,solvers,testing] @ git+https://github.com/flex-pse/flex-pse.git@0.3.1"
      # Ray 2.60.0 crashes in ray.shutdown() on Windows; drop this once a newer one doesn't.
      - "ray<2.60"
      # Acquirium main (b7f6fc8, v0.4.0a9); keep in step with environment.yml
      - "acquirium @ git+https://github.com/DataDrivenCPS/acquirium.git@b7f6fc8a764345dd172e9217cc25f255255493ad"
      # orchestrator server stack (FastAPI/uvicorn already come with acquirium)
      - httpx
      # parallel execution uses ray, which already comes with acquirium
      - -e .[dev]
