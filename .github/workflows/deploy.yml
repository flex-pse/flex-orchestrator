name: Deploy

# The tenant stacks (PLAN.md D14, M6, M8), on a real Docker host: build the
# image, start the cluster, and run tests/test_deploy.py (the isolation suite,
# a study in mode 3, and the restore drill) and tests/test_gateway.py (tenants
# behind the gateway, a generated client, idle tenants, backups off). Slower than CI, so it runs when the
# deployment changes, weekly, and by hand; it isn't part of the CI workflow.

on:
  pull_request:
    paths: &deploy-paths
      - "deploy/**"
      - "environment.yml"
      - "pyproject.toml"
      - "src/flex_orchestrator/connection.py"
      - "src/flex_orchestrator/orchestrator.py"
      - "src/flex_orchestrator/verify.py"
      - "src/flex_orchestrator/cli.py"
      - "src/flex_orchestrator/client.py"
      - "src/flex_orchestrator/server/**"
      - "src/flex_orchestrator/tests/test_deploy.py"
      - "src/flex_orchestrator/tests/test_gateway.py"
      - "docs/schemas/openapi.json"
      - ".github/workflows/deploy.yml"
  push:
    branches: [main]
    paths: *deploy-paths
  schedule:
    - cron: "0 7 * * 1" # weekly, after CI's drift check
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tenant-stacks:
    name: tenant stacks (isolation, restore drill)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLEXORCH_IMAGE: flexorch:dev
      # Throwaway secrets for this run; init_cluster.sh writes them.
      FLEXORCH_SECRETS: ${{ runner.temp }}/flexorch-secrets
      FLEXORCH_TEST_DEPLOY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      # The image, cached between runs: only changed layers are rebuilt.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          tags: flexorch:dev
          load: true
          cache-from: type=gha,scope=flexorch-image
          cache-to: type=gha,scope=flexorch-image,mode=max

      # The tests drive bash and docker; collecting them imports the package,
      # so it's installed with its core dependencies only (no Acquirium,
      # flex-pse or solvers: those are in the image). The gateway tests call
      # it over HTTPS (httpx) and generate a client (openapi-python-client).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest pytest-timeout httpx openapi-python-client

      - run: >-
          pytest -p no:cacheprovider -v
          src/flex_orchestrator/tests/test_deploy.py
          src/flex_orchestrator/tests/test_gateway.py

      - name: Collect container logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          docker ps -a > "$RUNNER_TEMP/logs/containers.txt"
          for c in $(docker ps -a --format '{{.Names}}'); do
            docker logs "$c" > "$RUNNER_TEMP/logs/$c.log" 2>&1 || true
          done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-stack-logs
          path: ${{ runner.temp }}/logs
